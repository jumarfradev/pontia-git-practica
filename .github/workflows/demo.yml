name: Demo Workflow

on:
  workflow_dispatch:
    inputs:
      mensaje:
        description: 'Escribe tu mensaje'
        required: true
        default: 'Hola desde GitHub Actions'

jobs:
  imprimir-mensaje:
    runs-on: ubuntu-latest
    steps:
      - name: Imprimir el mensaje
        run: echo "El mensaje es: ${{ github.event.inputs.mensaje }}"
